name: publish

# 两阶段发布：先由矩阵任务在 5 个平台完成构建并上传 artifact，
# 全部平台构建成功后才进入发布阶段，避免任一平台编译失败时在 npm 上留下
# 无法覆盖的孤儿平台包（v0.5.3 曾因此整次发布作废）。
# 非 tag 触发（workflow_dispatch）只跑构建阶段，用于验证构建链路，不会写入 registry。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  build-platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            platform: darwin
            arch: arm64
          - os: macos-14
            target: x86_64-apple-darwin
            platform: darwin
            arch: x64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
            arch: arm64
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            platform: win32
            arch: x64
    runs-on: ${{ matrix.os }}
    # 构建阶段不接触 registry，因此不挂 npm environment / 发布凭据。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@11.5.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Add Cargo to PATH on Windows
        if: runner.os == 'Windows'
        run: echo "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: cargo --version
      - run: npm install --package-lock-only --omit=optional --ignore-scripts
      - run: cargo build --release --manifest-path native/Cargo.toml --target ${{ matrix.target }}
      - run: node scripts/build-native-bin.js
        env:
          TARGET: ${{ matrix.target }}
          SKIP_CARGO_BUILD: "1"
      - run: node scripts/build-native-package.js
        env:
          npm_config_platform: ${{ matrix.platform }}
          npm_config_arch: ${{ matrix.arch }}
      - name: Upload platform package
        uses: actions/upload-artifact@v4
        with:
          name: platform-package-${{ matrix.platform }}-${{ matrix.arch }}
          path: npm/${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7

  publish-platform:
    # 需要全部平台构建成功；任一平台编译失败则一个包都不会发布。
    needs: build-platform
    # 仅 tag 触发时发布，workflow_dispatch 只做构建演练。
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin
            arch: arm64
          - platform: darwin
            arch: x64
          - platform: linux
            arch: x64
          - platform: linux
            arch: arm64
          - platform: win32
            arch: x64
    runs-on: ubuntu-24.04
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@11.5.1
      - name: Download platform package
        uses: actions/download-artifact@v4
        with:
          name: platform-package-${{ matrix.platform }}-${{ matrix.arch }}
          path: npm/${{ matrix.platform }}-${{ matrix.arch }}
      # artifact 上传/下载不保留文件权限，未修复会导致平台包二进制丢失可执行位（v0.5.5 曾因此发布出不可运行的包）。
      - name: Restore executable bit
        if: matrix.platform != 'win32'
        shell: bash
        working-directory: npm/${{ matrix.platform }}-${{ matrix.arch }}
        run: chmod +x bin/agentsshcli-native
      - name: Publish platform package
        shell: bash
        working-directory: npm/${{ matrix.platform }}-${{ matrix.arch }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE="@agent-ssh-cli/${{ matrix.platform }}-${{ matrix.arch }}"
          npm publish --provenance --access public || \
            if [ "$(npm view "${PACKAGE}@${VERSION}" version 2>/dev/null || true)" = "${VERSION}" ]; then
              echo "${PACKAGE}@${VERSION} already published"
            else
              exit 1
            fi

  publish-main:
    needs: publish-platform
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@11.5.1
      - run: npm install --package-lock-only --omit=optional --ignore-scripts
      - name: Publish main package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm publish --provenance --access public || \
            if [ "$(npm view "agent-ssh-cli@${VERSION}" version 2>/dev/null || true)" = "${VERSION}" ]; then
              echo "agent-ssh-cli@${VERSION} already published"
            else
              exit 1
            fi

  create-release:
    needs: publish-main
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 直接从仓库内 RELEASE_NOTES.md 提取当前版本章节作为 notes，
          # 不依赖 tag message（annotated tag 在 CI checkout 后提取不可靠）。
          awk -v ver="${GITHUB_REF_NAME}" '
            /^## / { if ($0 == "## " ver) { in_section = 1 } else if (in_section) { exit } }
            in_section { print }
          ' RELEASE_NOTES.md > release-notes.md
          if [ -s release-notes.md ]; then
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md \
              --latest ||
            gh release edit "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --latest ||
            gh release edit "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --latest
          fi

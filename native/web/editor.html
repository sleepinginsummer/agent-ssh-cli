<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CONFIG / agent-ssh-cli</title>
  <style>
    :root {
      color-scheme: dark;
      --paper: #101722; --surface: #141e2b; --surface-muted: #182432; --surface-hover: #1c2a39;
      --ink: #eef5fa; --ink-2: #d6e1e9; --muted: #8395a6; --muted-strong: #a8b7c4;
      --line: rgba(202, 226, 242, .12); --line-dark: #34475a;
      --accent: #ffad55; --accent-soft: rgba(255, 173, 85, .12); --signal: #49d4e7;
      --danger: #ff6875; --danger-soft: rgba(255, 104, 117, .12);
      --code: #111925; --code-2: #151f2c; --code-text: #d9e5ed; --radius: 8px;
      --ease-spring: cubic-bezier(.2, .8, .2, 1); --ease-out: cubic-bezier(.16, 1, .3, 1);
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-display: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
      --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body { margin: 0; min-width: 320px; overflow: hidden; background: var(--paper); color: var(--ink); font: 14px/1.45 var(--font-ui); }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .45; }
    svg { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    ::selection { background: var(--accent); color: #111925; }
    .skip-link { position: fixed; top: -60px; left: 10px; z-index: 100; padding: 9px 12px; border-radius: var(--radius); background: var(--accent); color: #111925; font-weight: 750; }
    .skip-link:focus { top: 10px; }

    .app { display: grid; grid-template-rows: 54px minmax(0, 1fr) 60px; height: 100dvh; min-height: 640px; }
    .topbar { display: grid; grid-template-columns: 260px minmax(0, 1fr) auto; align-items: stretch; border-bottom: 1px solid var(--line); background: var(--surface); }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; padding: 0 18px; border-right: 1px solid var(--line); }
    .brand-mark { display: grid; width: 20px; height: 20px; place-items: center; color: var(--accent); }
    .brand-mark .icon { width: 18px; height: 18px; }
    .brand-copy { display: flex; align-items: baseline; min-width: 0; gap: 12px; }
    .brand-copy strong { font: 750 14px/1 var(--font-mono); letter-spacing: .2px; white-space: nowrap; }
    .brand-copy span { color: var(--muted); font: 11px/1 var(--font-mono); }
    .pathbar { display: flex; align-items: center; min-width: 0; gap: 10px; padding: 0 16px; }
    .path-index { display: grid; width: 18px; height: 18px; place-items: center; color: var(--accent); }
    .path-index .icon { width: 14px; height: 14px; }
    .pathbar code { overflow: hidden; color: var(--muted-strong); font: 11px var(--font-mono); text-overflow: ellipsis; white-space: nowrap; }
    .top-actions { display: flex; align-items: center; gap: 8px; padding: 0 14px; border-left: 1px solid var(--line); }
    .top-actions .top-tool { min-height: 34px; padding: 6px 10px; font: 600 10px var(--font-mono); white-space: nowrap; }
    .top-actions .top-tool.active { border-color: rgba(255, 157, 66, .48); background: var(--accent-soft); color: var(--accent); }
    .btn, .icon-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 36px; border: 1px solid var(--line-dark); border-radius: var(--radius); background: transparent; color: var(--muted-strong); font-size: 12px; font-weight: 700; transition: border-color 150ms ease, background-color 150ms ease, color 150ms ease, transform 150ms ease; }
    .btn { padding: 7px 12px; } .icon-btn { width: 36px; padding: 0; }
    .btn:disabled, .icon-btn:disabled { cursor: not-allowed; opacity: .45; }
    .btn:hover, .icon-btn:hover { border-color: #536a7e; background: var(--surface-hover); color: var(--ink); }
    .btn:active, .icon-btn:active { transform: translateY(1px); }
    .btn.primary { border-color: var(--line-dark); background: var(--surface-hover); color: var(--muted-strong); }
    .btn.primary.dirty { border-color: var(--accent); background: var(--accent); color: #111925; }
    .btn.primary:hover { border-color: #536a7e; background: #243343; color: var(--ink); }
    .btn.primary.dirty:hover { border-color: #ffc071; background: #ffc071; color: #111925; }
    .btn.danger:hover, .icon-btn.danger:hover { border-color: var(--danger); background: var(--danger-soft); color: var(--danger); }
    .icon { width: 16px; height: 16px; stroke-width: 1.8; }
    .statusbar #save { min-width: 88px; min-height: 38px; }
    .unsaved-dot { display: none; flex: 0 0 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--danger); }
    #save.dirty .unsaved-dot { display: block; }
    .statusbar #discard { margin-left: auto; }

    .workspace { display: grid; grid-template-columns: 260px minmax(600px, 1fr) minmax(380px, 23vw); min-height: 0; overflow: hidden; }
    .connections { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; overflow: hidden; border-right: 1px solid var(--line); background: var(--surface); }
    .connections-head { padding: 15px 12px 12px; border-bottom: 1px solid var(--line); }
    .eyebrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; color: var(--muted); font: 10px var(--font-mono); white-space: nowrap; }
    .eyebrow strong { color: var(--ink-2); font: 600 11px var(--font-mono); }
    .search { position: relative; }
    .search .icon { position: absolute; top: 50%; left: 10px; width: 14px; height: 14px; color: var(--muted); transform: translateY(-50%); pointer-events: none; }
    .search input { width: 100%; height: 36px; padding: 0 10px 0 33px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); font-size: 12px; }
    .search input::placeholder { color: #718496; }
    .search input:focus { border-color: var(--accent); outline: 0; box-shadow: 0 0 0 2px var(--accent-soft); }
    .connection-list { overflow-y: auto; padding: 7px; scrollbar-color: #4d5c6b transparent; scrollbar-width: thin; }
    .connection-empty { padding: 28px 12px; color: var(--muted); font-size: 12px; text-align: center; }
    .connection-item { position: relative; display: grid; width: 100%; grid-template-columns: 10px minmax(0, 1fr) 18px; align-items: center; gap: 11px; min-height: 58px; margin: 0 0 3px; padding: 8px 10px; overflow: hidden; border: 1px solid transparent; border-radius: var(--radius); background: transparent; color: var(--muted-strong); text-align: left; transition: background-color 150ms ease, color 150ms ease; }
    .connection-item::before { position: absolute; top: 9px; bottom: 9px; left: 0; width: 2px; border-radius: 2px; background: transparent; content: ""; }
    .connection-item:hover { background: rgba(255, 255, 255, .025); color: var(--ink); }
    .connection-item.active { background: var(--surface-hover); color: var(--ink); }
    .connection-item.active::before { background: var(--accent); }
    .connection-index { width: 7px; height: 7px; border-radius: 50%; background: var(--signal); }
    .connection-index .icon { display: none; }
    .connection-item.active .connection-index { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .connection-item.unsaved .connection-index { background: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
    .connection-copy { display: grid; min-width: 0; }
    .connection-copy strong { overflow: hidden; font: 500 12px var(--font-mono); text-overflow: ellipsis; white-space: nowrap; }
    .connection-copy span { overflow: hidden; margin-top: 4px; color: var(--muted); font: 9px var(--font-mono); text-overflow: ellipsis; white-space: nowrap; }
    .auth-icon { color: var(--muted); } .connection-item.active .auth-icon { color: var(--accent); } .auth-icon .icon { width: 14px; height: 14px; }
    .connections-foot { padding: 10px; border-top: 1px solid var(--line); }
    .connections-foot .btn { width: 100%; border-style: dashed; }
    .connections-foot .btn:hover { border-color: var(--accent); color: var(--accent); }

    .editor { display: grid; grid-template-rows: auto auto minmax(0, 1fr); min-width: 0; min-height: 0; overflow: hidden; background: var(--paper); }
    .identity { display: grid; gap: 13px; padding: 17px clamp(24px, 4vw, 48px) 15px; border-bottom: 1px solid var(--line); background: var(--paper); }
    .identity-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; min-width: 0; }
    .identity-copy { min-width: 0; }
    .identity-kicker { margin-bottom: 5px; color: var(--accent); font: 700 9px var(--font-mono); letter-spacing: 1px; text-transform: uppercase; }
    .identity-primary { display: flex; align-items: baseline; min-width: 0; gap: 12px; }
    .identity h1 { overflow: hidden; margin: 0; font: 750 20px/1.2 var(--font-display); letter-spacing: 0; text-overflow: ellipsis; white-space: nowrap; }
    .endpoint { overflow: hidden; color: var(--muted); font: 10px var(--font-mono); text-overflow: ellipsis; white-space: nowrap; }
    .identity-actions { display: flex; flex: 0 0 auto; gap: 6px; }
    .identity-actions .icon-btn { width: 32px; min-height: 32px; }
    .identity-actions #test-connection { min-height: 32px; padding: 5px 9px; font-size: 10px; white-space: nowrap; }
    .test-status { margin-top: 6px; color: var(--muted-strong); font-size: 11px; overflow-wrap: anywhere; }
    .test-status.success { color: var(--signal); }
    .test-status.failure { color: var(--danger); }
    .route-summary { min-width: 0; padding: 12px 16px; overflow: hidden; border: 1px solid var(--line-dark); border-radius: 8px; background: var(--surface-muted); }
    .route-track { display: flex; align-items: center; min-width: 0; min-height: 34px; overflow-x: auto; scrollbar-width: thin; }
    .route-node { display: flex; flex: 0 0 auto; align-items: center; gap: 8px; min-height: 34px; padding: 6px 10px; border: 1px solid var(--line-dark); border-radius: 8px; background: var(--surface); color: var(--ink-2); }
    .route-node > .icon { width: 15px; height: 15px; color: var(--signal); }
    .route-node.route-target { border-color: rgba(255, 157, 66, .48); background: var(--accent-soft); }
    .route-node.route-target > .icon { color: var(--accent); }
    .route-node-text { max-width: 260px; overflow: hidden; font: 600 11px var(--font-mono); text-overflow: ellipsis; white-space: nowrap; }
    .route-node.route-local .route-node-text { color: var(--muted-strong); }
    .route-link { position: relative; flex: 0 0 52px; height: 2px; overflow: hidden; border-radius: 2px; background: transparent; }
    .route-base { position: absolute; inset: 0; display: flex; }
    .route-base > span { flex: 0 0 1.625px; height: 2px; background: rgb(210, 234, 250); opacity: var(--base-opacity); }
    .route-flow { display: flex; width: 16px; height: 2px; transform: translateX(-18px); animation: route-flow 3.2s linear var(--route-delay, 0s) infinite; }
    .route-flow > span { flex: 0 0 .5px; height: 2px; background: var(--accent); opacity: var(--flow-opacity); }
    @keyframes route-flow { from { transform: translateX(-18px); } to { transform: translateX(64px); } }
    .route-separator { flex: 0 0 auto; margin: 0 10px; color: var(--muted); font: 600 13px var(--font-mono); }
    .route-privilege { flex: 0 0 auto; color: var(--ink-2); font: 600 11px var(--font-mono); white-space: nowrap; }
    .tabs { display: flex; min-height: 42px; padding: 0 clamp(24px, 4vw, 48px); border-bottom: 1px solid var(--line); background: var(--paper); }
    .tab { position: relative; min-width: 76px; border: 0; background: transparent; color: var(--muted); font: 600 10px var(--font-mono); }
    .tab:hover { color: var(--ink); } .tab.active { color: var(--accent); }
    .tab.active::after { position: absolute; right: 12px; bottom: -1px; left: 12px; height: 2px; background: var(--accent); content: ""; }
    .form-scroll { overflow-y: auto; padding: 0 clamp(24px, 4vw, 48px) 56px; scrollbar-color: #4d5c6b transparent; scrollbar-width: thin; }
    .tab-page { display: none; width: min(100%, 980px); margin: 0 auto; } .tab-page.active { display: block; animation: page-in 180ms var(--ease-out); }
    @keyframes page-in { from { opacity: 0; transform: translateY(5px); } }
    .form-section { display: grid; grid-template-columns: 1fr; gap: 12px; padding: 18px 0; border-bottom: 1px solid var(--line); }
    .section-title { display: flex; align-items: center; justify-content: space-between; }
    .section-title h2 { margin: 0; color: var(--muted-strong); font: 600 11px var(--font-mono); letter-spacing: .4px; }
    .section-title .btn { min-height: 30px; padding: 4px 9px; font: 600 10px var(--font-mono); }
    .section-title .btn .icon { width: 13px; height: 13px; }
    .fields { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 10px 12px; }
    .field { min-width: 0; grid-column: span 6; }
    .field.full, .field.span-12 { grid-column: 1 / -1; }
    .field.span-2 { grid-column: span 2; } .field.span-3 { grid-column: span 3; }
    .field.span-4 { grid-column: span 4; } .field.span-5 { grid-column: span 5; }
    .field.span-6 { grid-column: span 6; } .field.span-7 { grid-column: span 7; }
    .field.span-8 { grid-column: span 8; }
    label, .label { display: block; margin-bottom: 5px; color: var(--muted); font: 9px var(--font-mono); }
    .required::after { color: var(--accent); content: " *"; }
    input, select, textarea { width: 100%; min-height: 36px; border: 1px solid var(--line-dark); border-radius: 6px; background: var(--surface-muted); color: var(--ink); transition: border-color 150ms ease, box-shadow 150ms ease; }
    input, select { padding: 6px 10px; } textarea { min-height: 74px; padding: 8px 10px; resize: vertical; }
    input:hover, select:hover, textarea:hover { border-color: #50667a; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: 0; box-shadow: 0 0 0 2px var(--accent-soft); }
    input::placeholder, textarea::placeholder { color: #6e8091; }
    input[aria-invalid="true"] { border-color: var(--danger); box-shadow: 0 0 0 2px var(--danger-soft); }
    .mono { font-family: var(--font-mono); font-size: 10px; }
    .error { min-height: 11px; margin-top: 3px; color: var(--danger); font: 8px var(--font-mono); }
    .secret-control { display: grid; grid-template-columns: minmax(0, 1fr) 36px 36px; }
    .secret-control input { border-radius: 6px 0 0 6px; }
    .secret-control .icon-btn { width: 36px; min-height: 36px; border-left: 0; border-radius: 0; background: var(--surface); }
    .secret-control .icon-btn:last-child { border-radius: 0 6px 6px 0; }
    .secret-control .icon-btn:hover { color: var(--accent); }
    .secret-meta { min-height: 11px; margin-top: 3px; color: var(--muted); font: 8px var(--font-mono); }
    .secret-meta.revealed { color: var(--accent); }
    .mode-switch { display: grid; grid-template-columns: repeat(2, 1fr); gap: 3px; padding: 3px; border: 1px solid var(--line-dark); border-radius: 7px; background: var(--surface); }
    .mode-switch button { min-height: 28px; border: 0; border-radius: 4px; background: transparent; color: var(--muted); font: 600 9px var(--font-mono); }
    .mode-switch button.active { background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 0 0 1px rgba(255, 173, 85, .45); }
    .toggle-row { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; align-items: center; gap: 9px; min-height: 42px; padding: 6px 9px; border: 1px solid var(--line-dark); border-radius: 6px; background: var(--surface-muted); }
    .toggle-row > .icon { width: 15px; height: 15px; color: var(--accent); }
    .toggle-copy strong { display: block; font-size: 10px; } .toggle-copy span { color: var(--muted); font: 8px var(--font-mono); }
    .toggle { position: relative; width: 40px; height: 22px; margin: 0; } .toggle input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .toggle-ui { position: absolute; inset: 0; border: 1px solid #526577; border-radius: 12px; background: var(--paper); }
    .toggle-ui::after { position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--muted); content: ""; transition: transform 170ms var(--ease-spring), background-color 150ms ease; }
    .toggle input:checked + .toggle-ui { border-color: var(--accent); background: var(--accent-soft); }
    .toggle input:checked + .toggle-ui::after { background: var(--accent); transform: translateX(18px); }
    .toggle input:focus-visible + .toggle-ui { outline: 2px solid var(--accent); outline-offset: 2px; }

    .json-panel { display: grid; grid-template-rows: 62px minmax(0, 1fr) 38px; min-width: 0; min-height: 0; overflow: hidden; border-left: 1px solid var(--line); background: var(--code); color: var(--code-text); }
    .json-head { display: flex; align-items: center; gap: 10px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
    .json-head > .icon { color: var(--accent); } .json-title { min-width: 0; }
    .json-title strong { display: block; font: 600 11px var(--font-mono); }
    .json-title span { display: block; margin-top: 4px; color: var(--muted); font: 9px var(--font-mono); }
    .json-tools { display: flex; align-items: center; gap: 5px; margin-left: auto; }
    .json-panel .icon-btn { min-height: 32px; width: 32px; border-color: transparent; }
    .json-panel .icon-btn:hover { border-color: var(--line-dark); color: var(--accent); }
    .view-switch { display: flex; gap: 3px; padding: 3px; border: 1px solid var(--line-dark); border-radius: 10px; background: var(--paper); }
    .view-switch button { min-height: 26px; padding: 3px 8px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font: 9px var(--font-mono); }
    .view-switch button.active { background: var(--accent-soft); color: var(--accent); }
    .scope-switch { display: flex; gap: 5px; }
    .scope-switch button { min-height: 30px; padding: 4px 9px; border: 1px solid var(--line-dark); border-radius: 8px; background: var(--paper); color: var(--muted); font: 600 9px var(--font-mono); white-space: nowrap; }
    .scope-switch button:hover { border-color: #536a7e; color: var(--ink); }
    .scope-switch button.active { border-color: rgba(255, 157, 66, .65); background: var(--accent-soft); color: var(--accent); }
    .code-stage { position: relative; min-height: 0; overflow: hidden; }
    .code-stage::before { position: absolute; top: 0; bottom: 0; left: 42px; z-index: 1; width: 1px; background: var(--line); content: ""; pointer-events: none; }
    pre, .source { position: absolute; inset: 0; overflow: auto; margin: 0; padding: 17px 18px 48px 55px; border: 0; border-radius: 0; background: var(--code); color: var(--code-text); font: 11px/1.7 var(--font-mono); tab-size: 2; white-space: pre; scrollbar-color: #4d5c6b transparent; scrollbar-width: thin; }
    .source { display: none; width: 100%; height: 100%; resize: none; outline: 0; } .source.active { display: block; } pre.hidden { display: none; }
    .j-key { color: #8fd7ff; } .j-string { color: #c4df9b; } .j-number { color: var(--accent); } .j-boolean { color: #ff8b79; } .j-null { color: var(--muted); }
    .json-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 14px; border-top: 1px solid var(--line); background: var(--code-2); color: var(--muted); font: 9px var(--font-mono); }
    .json-valid { color: var(--signal); }
    .statusbar { display: flex; align-items: center; min-width: 0; gap: 10px; padding: 0 18px 0 42px; border-top: 1px solid var(--line); background: var(--surface); color: var(--muted); font: 10px var(--font-mono); }
    .statusbar .icon { width: 12px; height: 12px; color: var(--signal); } .statusbar .error-state { color: var(--danger); }
    .status-meta { display: flex; gap: 16px; margin-left: 0; } .status-meta::before { color: #516476; content: "·"; }
    .toast { position: fixed; right: 18px; bottom: 74px; z-index: 80; display: grid; grid-template-columns: 28px minmax(0, 1fr); align-items: center; gap: 10px; width: min(360px, calc(100vw - 32px)); padding: 11px; border: 1px solid rgba(255, 173, 85, .4); border-radius: var(--radius); background: var(--surface-muted); color: var(--ink); box-shadow: 0 14px 34px rgba(0, 0, 0, .28); font-size: 12px; font-weight: 700; opacity: 0; pointer-events: none; transform: translateY(14px); transition: opacity 160ms ease, transform 220ms var(--ease-spring); }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast-mark { display: grid; width: 28px; height: 28px; place-items: center; border-radius: 6px; background: var(--accent-soft); color: var(--accent); }

    @media (min-width: 1241px) {
      .workspace.json-panel-closed { grid-template-columns: 260px minmax(600px, 1fr); }
      .json-panel.closed { display: none; }
    }
    @media (max-width: 1240px) {
      .workspace { grid-template-columns: 250px minmax(0, 1fr); }
      .topbar { grid-template-columns: 250px minmax(0, 1fr) auto; }
      .json-panel { position: fixed; z-index: 60; top: 54px; right: 0; bottom: 60px; width: min(480px, 84vw); box-shadow: -10px 0 30px rgba(0, 0, 0, .32); transform: translateX(100%); transition: transform 260ms var(--ease-out); }
      .json-panel.open { transform: translateX(0); }
    }
    @media (max-width: 760px) {
      body { overflow: auto; }
      .app { grid-template-rows: auto minmax(0, 1fr) 54px; min-height: 760px; }
      .topbar { grid-template-columns: 1fr auto; min-height: 54px; }
      .brand { min-width: 0; border-right: 0; } .brand-copy span { display: none; }
      .pathbar { grid-column: 1 / -1; grid-row: 2; min-height: 38px; border-top: 1px solid var(--line); }
      .top-actions { grid-column: 2; grid-row: 1; padding: 0 10px; border-left: 0; }
      .top-actions .top-tool { width: 34px; padding: 0; } .top-actions .top-tool span { display: none; }
      .workspace { display: block; overflow-y: auto; }
      .connections { display: block; border-right: 0; border-bottom: 1px solid var(--line); }
      .connections-head { display: grid; grid-template-columns: auto minmax(170px, 1fr); align-items: center; gap: 14px; }
      .eyebrow { margin: 0; }
      .connection-list { display: flex; gap: 5px; overflow-x: auto; padding: 8px 10px; }
      .connection-item { flex: 0 0 205px; margin: 0; } .connections-foot { display: none; }
      .editor { min-height: 760px; }

    }

  <div class="app">
    <header class="topbar">

                <div class="field span-2"><label for="f-suUser">su 用户</label><input class="mono" id="f-suUser" data-field="suUser" placeholder="root"></div>
                <div class="field span-4"><label for="f-suPasswordRef">su 密码引用</label><input class="mono" id="f-suPasswordRef" data-field="suPasswordRef" placeholder="agentsshcli:name:su"></div>

            <section class="form-section">

              <div class="fields">

                <div class="field full"><label for="f-commandBlacklist">黑名单</label><textarea class="mono" id="f-commandBlacklist" data-array="commandBlacklist" placeholder="^dangerous-command(\\s|$)"></textarea></div>

      </main>

      <aside class="json-panel" id="json-panel" aria-label="JSON 编辑器">
        <div class="json-head">
          <svg class="icon" aria-hidden="true"><use href="#i-file-json"></use></svg>
          <div class="json-title"><strong>config.json</strong><span>与表单实时同步</span></div>
          <div class="json-tools">
            <div class="view-switch"><button class="active" id="preview-mode" type="button">预览</button><button id="source-mode" type="button">源码</button></div>
            <div class="scope-switch" role="group" aria-label="JSON 显示范围"><button class="active" id="json-scope-all" type="button" aria-pressed="true">全局</button><button id="json-scope-current" type="button" aria-pressed="false">当前连接</button></div>
            <button class="icon-btn" id="copy-json" type="button" title="复制 JSON" aria-label="复制 JSON"><svg class="icon" aria-hidden="true"><use href="#i-copy"></use></svg></button>
            <button class="icon-btn" id="close-json" type="button" title="关闭 JSON" aria-label="关闭 JSON"><svg class="icon" aria-hidden="true"><use href="#i-panel-right-close"></use></svg></button>

      <button class="btn" id="discard" type="button" disabled><svg class="icon" aria-hidden="true"><use href="#i-undo-2"></use></svg><span>撤销改动</span></button>
      <button class="btn primary" id="save" type="button"><svg class="icon" aria-hidden="true"><use href="#i-save"></use></svg><span>保存配置</span><span class="unsaved-dot" aria-hidden="true"></span></button>
    </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"><span class="toast-mark"><svg class="icon" aria-hidden="true"><use href="#i-check"></use></svg></span><span id="toast-text"></span></div>

  <script>
    const seed = [
      { name: "生产应用", host: "10.20.8.14", port: 22, username: "deploy", passwordRef: "agentsshcli:生产应用", jumpHost: "公网跳板机", allowedLocalPaths: ["./dist", "./releases"] },
      { name: "公网跳板机", host: "203.0.113.24", port: 2202, username: "ops", privateKey: "~/.ssh/ops_ed25519", socksProxy: "socks5://127.0.0.1:1080" },
      { name: "日志归档", host: "10.20.9.31", port: 22, username: "reader", privateKey: "~/.ssh/archive_rsa", privilegeEnabled: true, sudoUser: "root", sudoPasswordRef: "agentsshcli:日志归档:sudo", commandWhitelist: ["^ls(\\s|$)", "^cat\\s+/var/log/"] }
    ];
    let defaultCommandBlacklist = [];

    let connections = structuredClone(seed);
    let selected = 0;
    let dirty = false;
    let savedConnections = structuredClone(seed);
    let savedByItem = new WeakMap();
    let configHash = "";
    let editVersion = 0;
    let referenceName = connections[0]?.name || "";
    const secretUi = new WeakMap();
    let toastTimer;
    let lastActivityReport = 0;
    const ACTIVITY_REPORT_INTERVAL_MS = 30_000;

    const $ = selector => document.querySelector(selector);
    const $$ = selector => [...document.querySelectorAll(selector)];
    const list = $("#connection-list");
    const form = $("#form");
    const jsonPanel = $("#json-panel");
    const jsonPreview = $("#json-preview");
    const jsonSource = $("#json-source");
    const workspace = $(".workspace");
    const jsonPanelMedia = window.matchMedia("(max-width: 1240px)");
    let jsonPanelOpen = !jsonPanelMedia.matches;
    let jsonScope = "all";
    const editorToken = new URLSearchParams(location.hash.slice(1)).get("t") || "";
    // EDITOR_VALIDATION_START：仅包含可在 Node VM 中执行的前端即时校验纯逻辑。
    const FIELD_SCHEMA = [
      { key: "name", type: "string", required: "连接名称不能为空", unique: "连接名称必须唯一" },
      { key: "host", type: "string", required: "主机不能为空" },
      { key: "port", type: "number", defaultValue: 22, required: "端口不能为空", validate: value => Number.isInteger(value) && value >= 1 && value <= 65535 ? "" : "端口范围为 1 到 65535" },
      { key: "username", type: "string", required: "用户名不能为空" },
      { key: "passwordRef", type: "string" },
      { key: "privateKey", type: "string" },
      { key: "passphrase", type: "string" },
      { key: "socksProxy", type: "string" },
      { key: "jumpHost", type: "string", validate: (value, context) => !value || context.items.some((entry, index) => index !== context.index && entry?.name === value) ? "" : "跳板机连接不存在" },
      { key: "pty", type: "boolean" },
      { key: "privilegeEnabled", type: "boolean" },
      { key: "sudoUser", type: "string" },
      { key: "sudoPasswordRef", type: "string" },
      { key: "suUser", type: "string" },
      { key: "suPasswordRef", type: "string" },
      { key: "allowedLocalPaths", type: "array" },
      { key: "commandWhitelist", type: "array" },
      { key: "commandBlacklist", type: "array" }
    ];
    const scalarFields = FIELD_SCHEMA.filter(field => field.type === "string" || field.type === "number");
    const booleanFields = FIELD_SCHEMA.filter(field => field.type === "boolean");
    const arrayFields = FIELD_SCHEMA.filter(field => field.type === "array");
    const knownFields = new Set(FIELD_SCHEMA.map(field => field.key));

    function matchesFieldType(value, type) {
      if (type === "array") return Array.isArray(value) && value.every(item => typeof item === "string");
      return typeof value === type && (type !== "number" || Number.isFinite(value));
    }

    function validateConnections(items) {
      if (!Array.isArray(items) || items.length === 0) return { ok: false, errors: [], message: "根节点必须是非空数组" };
      const errors = items.map(() => ({}));
      items.forEach((item, index) => {
        if (!item || typeof item !== "object" || Array.isArray(item) || Object.getPrototypeOf(item) !== Object.prototype) {
          errors[index]._root = "连接项必须是普通对象";
          return;
        }
        const unknown = Object.keys(item).find(key => !knownFields.has(key));
        if (unknown) errors[index]._root = `不支持字段 ${unknown}`;
        FIELD_SCHEMA.forEach(field => {
          const rawValue = item[field.key];
          const rawEmpty = rawValue === undefined || rawValue === null || (typeof rawValue === "string" && !rawValue.trim());
          const value = rawEmpty && field.defaultValue !== undefined ? field.defaultValue : rawValue;
          const empty = value === undefined || value === null || (typeof value === "string" && !value.trim());
          if (field.required && empty) errors[index][field.key] = field.required;
          else if (!empty && !matchesFieldType(value, field.type)) errors[index][field.key] = `${field.key} 类型必须为 ${field.type}`;
          else if (field.unique && items.some((entry, candidate) => candidate !== index && entry?.[field.key] === value)) errors[index][field.key] = field.unique;
          else if (field.validate && !errors[index][field.key]) {
            const message = field.validate(value, { item, index, items });
            if (message) errors[index][field.key] = message;
          }
        });
        if (!item.passwordRef && !item.privateKey) errors[index]._auth = "必须配置密码引用或私钥";
        if (item.passwordRef && item.privateKey) errors[index]._auth = "密码引用和私钥不能同时配置";
      });
      const firstIndex = errors.findIndex(item => Object.keys(item).length > 0);
      const firstMessage = firstIndex >= 0 ? Object.values(errors[firstIndex])[0] : "";
      return { ok: firstIndex < 0, errors, message: firstIndex < 0 ? "" : `第 ${firstIndex + 1} 个连接：${firstMessage}` };
    }

    // EDITOR_VALIDATION_END

    // EDITOR_ROUTE_START：仅包含可在 Node VM 中执行的线路计算纯逻辑。
    function connectionEndpoint(item, fallback = {}) {
      const username = item?.username || fallback.username || "?";
      const host = item?.host || fallback.host || "?";
      const port = item?.port ?? fallback.port ?? 22;
      return `${username}@${host}:${port}`;
    }

    function proxyEndpoint(value = "") {
      const authority = String(value).replace(/^socks5:\/\//, "").split("/")[0];
      return authority.slice(authority.lastIndexOf("@") + 1);
    }

    function directConnectionTransport(item) {
      return item?.socksProxy ? "targetSocks" : "direct";
    }

    function connectionTransport(item, items) {
      if (item?.jumpHost) {
        const jump = items.find(candidate => candidate.name === item.jumpHost);
        if (!jump) return { kind: "invalidJump" };
        return { kind: "jump", jump, jumpTransport: directConnectionTransport(jump) };
      }
      return { kind: directConnectionTransport(item) };
    }

    function buildConnectionRoute(item, items) {
      if (!item) return [];
      const route = [{ kind: "local", label: "本机", detail: "localhost" }];
      const transport = connectionTransport(item, items);
      if (transport.kind === "jump") {
        if (transport.jumpTransport === "targetSocks") route.push({ kind: "proxy", label: "SOCKS5", detail: proxyEndpoint(transport.jump.socksProxy) });
        route.push({ kind: "jump", label: transport.jump.name, detail: connectionEndpoint(transport.jump) });
      } else if (transport.kind === "targetSocks") {
        route.push({ kind: "proxy", label: "SOCKS5", detail: proxyEndpoint(item.socksProxy) });
      }
      route.push({ kind: "target", label: item.name || "目标服务器", detail: connectionEndpoint(item) });
      if (item.privilegeEnabled) {
        const users = [`sudo:${item.sudoUser || "root"}`];
        if (item.suPasswordRef || item.suUser) users.push(`su:${item.suUser || "root"}`);
        route.push({ kind: "privilege", label: "提权", detail: users.join(" · ") });
      }
      return route;
    }
    // EDITOR_ROUTE_END
    function escapeHtml(value = "") {
      return String(value).replace(/[&<>"']/g, character => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[character]);
    }

    function current() { return connections[selected]; }
    function authMode(item = current()) { return item?.privateKey ? "key" : "password"; }
    function iconUse(id) { return `<svg class="icon" aria-hidden="true"><use href="#${id}"></use></svg>`; }
    function connectionView(item) {
      const mode = authMode(item);
      return {
        displayName: item.name || "未命名连接",
        endpoint: connectionEndpoint(item, { username: "user", host: "host" }),
        mode,
        authLabel: mode === "key" ? "私钥认证" : "密码认证",
        authIcon: mode === "key" ? "i-key-round" : "i-lock-keyhole"
      };
    }
    function renderChromeIcons() {
      $("#path-icon").innerHTML = iconUse("i-file-json");
    }

    function updateListItem(button, item, index) {
      const view = connectionView(item);
      const unsaved = connectionChanged(item);
      button.connection = item;
      button.dataset.index = index;
      button.classList.toggle("active", index === selected);
      button.classList.toggle("unsaved", unsaved);
      button.setAttribute("aria-current", String(index === selected));
      button.setAttribute("aria-label", `第 ${index + 1} 个连接：${view.displayName}${unsaved ? "，未保存" : ""}`);
      button.querySelector(".connection-copy strong").textContent = view.displayName;
      button.querySelector(".connection-copy span").textContent = view.endpoint;
      const authIcon = button.querySelector(".auth-icon");
      authIcon.querySelector("use").setAttribute("href", `#${view.authIcon}`);
      authIcon.title = view.authLabel;
      authIcon.setAttribute("aria-label", view.authLabel);
    }

    function renderList() {
      const query = $("#search").value.trim().toLowerCase();
      const visible = connections.map((item, index) => ({ item, index })).filter(({ item }) => `${item.name || ""} ${item.host || ""} ${item.username || ""}`.toLowerCase().includes(query));
      const oldButtons = [...list.querySelectorAll(".connection-item")];
      const byItem = new Map(oldButtons.map(button => [button.connection, button]));
      const byName = new Map(oldButtons.map(button => [button.connection.name, button]));
      const retained = new Set();
      const scrollTop = list.scrollTop;
      const scrollLeft = list.scrollLeft;
      const focusWasInList = list.contains(document.activeElement);
      if (!visible.length) {
        if (!list.querySelector(".connection-empty")) list.innerHTML = `<div class="connection-empty">未找到连接</div>`;
      } else {
        visible.forEach(({ item, index }, order) => {
          const named = byName.get(item.name);
          let button = byItem.get(item);
          if (!button && named && !connections.includes(named.connection) && !retained.has(named)) button = named;
          if (!button) {
            button = document.createElement("button");
            button.type = "button";
            button.className = "connection-item";
            button.innerHTML = `<span class="connection-index">${iconUse("i-server")}</span><span class="connection-copy"><strong></strong><span></span></span><span class="auth-icon">${iconUse("i-lock-keyhole")}</span>`;
          }
          updateListItem(button, item, index);
          retained.add(button);
          if (list.children[order] !== button) list.insertBefore(button, list.children[order] || null);
        });
        [...list.children].forEach(child => { if (!retained.has(child)) child.remove(); });
      }
      list.scrollTop = scrollTop;
      list.scrollLeft = scrollLeft;
      if (focusWasInList && !list.contains(document.activeElement)) list.querySelector(".connection-item.active")?.focus({ preventScroll: true });
      $("#connection-count").textContent = `${connections.length} 个连接`;
      $("#status-count").textContent = `${connections.length} 个连接`;
    }

    function updateCurrentListItem() {
      const button = list.querySelector(`[data-index="${selected}"]`);
      if (button && current()) updateListItem(button, current(), selected);
    }

    function renderJumpHosts() {
      const field = $("#f-jumpHost");
      const value = current()?.jumpHost || "";
      const candidates = connections.filter((_, index) => index !== selected);
      const options = candidates.length
        ? candidates.map(item => {
            const endpoint = connectionEndpoint(item);
            return `<option value="${escapeHtml(item.name)}">${escapeHtml(item.name)} · ${escapeHtml(endpoint)}</option>`;
          }).join("")
        : `<option value="" disabled>暂无其他连接</option>`;
      field.innerHTML = `<option value="">不使用跳板机</option>${options}`;
      field.value = value;
    }

    function secretState(item) {
      if (!secretUi.has(item)) {
        secretUi.set(item, { draftValue: "", revealedValue: "", mode: "empty", visible: false, timer: 0, createdRef: false });
      }
      return secretUi.get(item);
    }

    function clearSecretState(item) {
      const state = secretUi.get(item);
      if (!state) return;
      clearTimeout(state.timer);
      state.draftValue = "";
      state.revealedValue = "";
      state.mode = "empty";
      state.visible = false;
      state.createdRef = false;
    }

    function renderSecret() {
      const item = current();
      const state = secretState(item);
      const field = $("#f-password");
      const reveal = $("[data-reveal=\"password\"]");
      const meta = $("[data-secret-meta=\"password\"]");
      field.value = state.mode === "revealed" ? state.revealedValue : state.draftValue;
      field.readOnly = state.mode === "revealed";
      field.type = state.mode === "revealed" && state.visible ? "text" : "password";
      reveal.disabled = !item.passwordRef || state.mode === "draft";
      reveal.querySelector("use").setAttribute("href", state.visible ? "#i-eye-off" : "#i-eye");
      reveal.setAttribute("aria-label", state.visible ? "隐藏密码" : "查看已保存密码");
      meta.textContent = state.mode === "draft" ? "新密码待保存" : state.mode === "revealed" ? "只读明文将在短时间后清除" : item.passwordRef ? "已加密" : "未保存密码";
      meta.classList.toggle("revealed", state.mode === "revealed");
    }

    function replacePassword() {
      const item = current();
      const state = secretState(item);
      clearTimeout(state.timer);
      state.revealedValue = "";
      state.draftValue = "";
      state.mode = "draft";
      state.visible = false;
      renderSecret();
      $("#f-password").focus();
    }

    async function revealPassword() {
      const item = current();
      const state = secretState(item);
      if (state.mode === "revealed" && state.revealedValue) {
        state.visible = !state.visible;
        renderSecret();
        return;
      }
      if (!item.passwordRef) return toast("当前连接没有可解密的密码引用");
      if (location.protocol === "file:") return toast("请通过 agentsshcli edit-config 启动后查看密码");
      const button = $("[data-reveal=\"password\"]");
      button.disabled = true;
      try {
        const payload = await apiRequest("/api/secrets/reveal", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ connection: item.name, kind: "password" })
        });
        state.revealedValue = payload.secret;
        state.mode = "revealed";
        state.visible = true;
        clearTimeout(state.timer);
        state.timer = setTimeout(() => {
          if (state.mode !== "revealed") return;
          state.revealedValue = "";
          state.visible = false;
          state.mode = "empty";
          if (current() === item) renderSecret();
        }, 15000);
      } catch (error) {
        toast(error.message);
      } finally {
        renderSecret();
      }
    }

    function renderForm() {
      const item = current();
      if (!item) return;
      if (item.name) referenceName = item.name;
      scalarFields.forEach(({ key, defaultValue = "" }) => {
        const field = $(`#f-${key}`);
        if (field) field.value = item[key] ?? defaultValue;
      });
      booleanFields.forEach(({ key }) => {
        const field = $(`#f-${key}`);
        if (field) field.checked = Boolean(item[key]);
      });
      arrayFields.forEach(({ key }) => { $(`#f-${key}`).value = (item[key] || []).join("\n"); });
      renderJumpHosts();
      renderSecret();
      setAuthMode(authMode(item), false);
      renderIdentity();
      validate();
    }

    function renderConnectionRoute() {
      const icons = {
        local: "i-terminal-square",
        proxy: "i-network",
        jump: "i-route",
        target: "i-server",
        privilege: "i-shield-check"
      };
      const route = buildConnectionRoute(current(), connections);
      const flow = Array.from({ length: 32 }, (_, index) => {
        const position = (index + 0.5) / 32;
        const opacity = 1 - Math.abs(position * 2 - 1);
        return `<span style="--flow-opacity:${opacity.toFixed(3)}"></span>`;
      }).join("");
      const base = Array.from({ length: 32 }, (_, index) => {
        const opacity = 0.24 + (index / 31) * 0.08;
        return `<span style="--base-opacity:${opacity.toFixed(3)}"></span>`;
      }).join("");
      $("#connection-route").innerHTML = route.map((node, index) => {
        if (node.kind === "privilege") {
          return `<span class="route-separator" aria-hidden="true">/</span><span class="route-privilege" title="${escapeHtml(node.label)}">${escapeHtml(node.detail)}</span>`;
        }
        const delay = index * 0.3 - 0.1;
        const link = index ? `<span class="route-link" style="--route-delay:${delay.toFixed(1)}s" aria-hidden="true"><span class="route-base">${base}</span><span class="route-flow">${flow}</span></span>` : "";
        const text = node.kind === "local"
          ? node.label
          : node.kind === "target" ? node.detail : `${node.label} · ${node.detail}`;
        return `${link}<span class="route-node route-${escapeHtml(node.kind)}" title="${escapeHtml(`${node.label} ${node.detail}`.trim())}">${iconUse(icons[node.kind] || "i-server")}<span class="route-node-text">${escapeHtml(text)}</span></span>`;
      }).join("");
    }

    function renderIdentity() {
      const item = current();
      if (!item) return;
      const view = connectionView(item);
      $("#identity-name").textContent = view.displayName;
      $("#identity-endpoint").textContent = view.endpoint;
      $("#identity-mode").textContent = view.authLabel;
      renderConnectionRoute();
    }

    function setAuthMode(mode, mutate = true) {
      $$('[data-auth]').forEach(button => button.classList.toggle("active", button.dataset.auth === mode));
      $$('[data-auth-field]').forEach(field => { field.hidden = field.dataset.authField !== mode; });
      if (!mutate) return;
      const item = current();
      if (mode === "key") {
        clearSecretState(item);
        delete item.password;
        delete item.passwordRef;
        item.privateKey ||= "~/.ssh/id_ed25519";
      } else {
        delete item.privateKey;
        delete item.passphrase;
      }
      markDirty();
      renderForm();
      updateCurrentListItem();
      renderJson();
    }

    function updateFromForm(event) {
      const item = current();
      if (event?.target.matches("[data-secret]")) {
        const state = secretState(item);
        clearTimeout(state.timer);
        state.draftValue = event.target.value;
        if (state.draftValue && !item.passwordRef) {
          item.passwordRef = `agentsshcli:${item.name || "connection"}`;
          state.createdRef = true;
          $("#f-passwordRef").value = item.passwordRef;
        } else if (!state.draftValue && state.createdRef) {
          delete item.passwordRef;
          state.createdRef = false;
          $("#f-passwordRef").value = "";
        }
        state.mode = state.draftValue ? "draft" : "empty";
        state.visible = false;
        markDirty();
        renderJson();
        validate();
        renderSecret();
        return;
      }
      scalarFields.forEach(({ key, type }) => {
        const field = $(`#f-${key}`);
        if (!field) return;
        const value = type === "number" ? Number(field.value) : field.value.trim();
        if (value === "" || (type === "number" && !Number.isFinite(value))) delete item[key];
        else item[key] = value;
      });
      booleanFields.forEach(({ key }) => {
        const field = $(`#f-${key}`);
        if (field) item[key] = field.checked;
      });
      arrayFields.forEach(({ key }) => {
        const values = $(`#f-${key}`).value.split("\n").map(value => value.trim()).filter(Boolean);
        if (values.length) item[key] = values; else delete item[key];
      });
      if (item.name && referenceName && item.name !== referenceName) {
        connections.forEach(entry => { if (entry.jumpHost === referenceName) entry.jumpHost = item.name; });
        referenceName = item.name;
      }
      markDirty();
      if ($("#search").value.trim()) renderList(); else updateCurrentListItem();
      renderIdentity();
      renderJson();
      validate();
    }

    function validate() {
      const result = validateConnections(connections);
      const errors = result.errors[selected] || {};
      FIELD_SCHEMA.filter(field => field.required || field.unique || field.validate).forEach(({ key }) => {
        const field = $(`#f-${key}`);
        const error = $(`[data-error="${key}"]`);
        if (field) field.setAttribute("aria-invalid", errors[key] ? "true" : "false");
        if (error) error.textContent = errors[key] || "";
      });
      const count = result.errors.reduce((total, item) => total + Object.keys(item).length, 0);
      $("#status").textContent = result.ok ? "配置有效" : `${count} 个配置项需要修正`;
      $("#status").classList.toggle("error-state", !result.ok);
      $(".statusbar > .icon use").setAttribute("href", result.ok ? "#i-check" : "#i-circle-alert");
      return result.ok;
    }

    // EDITOR_JSON_COMPARE_START：规范化字段顺序，避免只因对象键顺序不同而误报修改。
    function ordered(item) {
      const result = {};
      FIELD_SCHEMA.forEach(({ key }) => {
        const value = item[key];
        if (value !== undefined && value !== "" && !(Array.isArray(value) && value.length === 0)) result[key] = value;
      });
      return result;
    }

    function connectionsSemanticallyEqual(left, right) {
      return JSON.stringify(left.map(ordered)) === JSON.stringify(right.map(ordered));
    }
    // EDITOR_JSON_COMPARE_END

    function jsonText() {
      const value = jsonScope === "current" ? ordered(current()) : connections.map(ordered);
      return JSON.stringify(value, null, 2);
    }

    function highlight(json) {
      return escapeHtml(json).replace(/(&quot;(?:\\u[a-fA-F0-9]{4}|\\[^u]|[^\\&])*&quot;)(\s*:)?|\b(true|false)\b|\b(null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/g, (match, token, colon, bool, nil) => {
        if (token) return `<span class="${colon ? "j-key" : "j-string"}">${token}</span>${colon || ""}`;
        if (bool) return `<span class="j-boolean">${match}</span>`;
        if (nil) return `<span class="j-null">${match}</span>`;
        return `<span class="j-number">${match}</span>`;
      });
    }

    function renderJson() {
      const text = jsonText();
      jsonPreview.innerHTML = highlight(text);
      if (!jsonSource.matches(":focus")) jsonSource.value = text;
      $("#json-lines").textContent = `${text.split("\n").length} 行`;
    }

    function renderAll() { renderList(); renderForm(); renderJson(); updateSyncState(); }

    function captureSavedSnapshot(snapshot, items = connections) {
      savedConnections = structuredClone(snapshot);
      savedByItem = new WeakMap();
      items.forEach((item, index) => savedByItem.set(item, savedConnections[index]));
    }

    function connectionChanged(item) {
      const saved = savedByItem.get(item);
      const state = secretUi.get(item);
      return !saved || JSON.stringify(ordered(item)) !== JSON.stringify(ordered(saved)) || Boolean(state?.mode === "draft" && state.draftValue);
    }

    function markDirty() { editVersion += 1; setTestStatus(); updateSyncState(); }
    function updateSyncState() {
      dirty = (jsonSource.classList.contains("active") && jsonSource.value !== jsonText()) || !connectionsSemanticallyEqual(connections, savedConnections) || connections.some(item => {
        const state = secretUi.get(item);
        return state?.mode === "draft" && Boolean(state.draftValue);
      });
      $("#save").classList.toggle("dirty", dirty);
      $("#discard").disabled = !dirty || $("#save").disabled;
      list.querySelectorAll(".connection-item").forEach(button => {
        const item = connections[Number(button.dataset.index)];
        if (!item) return;
        const unsaved = connectionChanged(item);
        button.classList.toggle("unsaved", unsaved);
        button.setAttribute("aria-label", `第 ${Number(button.dataset.index) + 1} 个连接：${connectionView(item).displayName}${unsaved ? "，未保存" : ""}`);
      });
    }

    function setTestStatus(message = "", kind = "") {
      const status = $("#connection-test-status");
      status.hidden = !message;
      status.textContent = message;
      status.classList.toggle("success", kind === "success");
      status.classList.toggle("failure", kind === "failure");
    }

    function selectConnection(index) {
      if (index === selected) return;
      setTestStatus();
      if (!commitPendingJsonSource()) return;
      const previous = list.querySelector(".connection-item.active");
      const next = list.querySelector(`[data-index="${index}"]`);
      if (previous) {
        previous.classList.remove("active");
        previous.setAttribute("aria-current", "false");
      }
      if (next) {
        next.classList.add("active");
        next.setAttribute("aria-current", "true");
      }
      selected = index;
      renderForm();
      renderJson();
      if (jsonSource.classList.contains("active")) jsonSource.value = jsonText();
    }

    function addDefaultBlacklist() {
      const field = $("#f-commandBlacklist");
      const currentValues = field.value.split("\n").map(value => value.trim()).filter(Boolean);
      const merged = [...new Set([...currentValues, ...defaultCommandBlacklist])];
      if (merged.length === currentValues.length) return toast("黑名单默认值已存在");
      field.value = merged.join("\n");
      field.dispatchEvent(new Event("input", { bubbles: true }));
      toast(`已添加 ${merged.length - currentValues.length} 条黑名单默认值`);
    }

    function addConnection() {
      if (!commitPendingJsonSource()) return;
      let number = connections.length + 1;
      let name = `新连接 ${number}`;
      while (connections.some(item => item.name === name)) name = `新连接 ${++number}`;
      connections.push({ name, host: "", port: 22, username: "root" });
      selected = connections.length - 1;
      $("#search").value = "";
      markDirty();
      renderAll();
      $("#f-host").focus();
    }

    function duplicateConnection() {
      if (!commitPendingJsonSource()) return;
      const copy = structuredClone(current());
      let number = 2;
      const base = `${copy.name || "连接"} 副本`;
      copy.name = base;
      while (connections.some(item => item.name === copy.name)) copy.name = `${base} ${number++}`;
      delete copy.passwordRef;
      delete copy.sudoPasswordRef;
      delete copy.suPasswordRef;
      connections.splice(selected + 1, 0, copy);
      clearSecretState(copy);
      selected += 1;
      markDirty();
      renderAll();
      toast("连接已复制");
    }

    function deleteConnection() {
      if (!commitPendingJsonSource()) return;
      if (connections.length === 1) return toast("至少保留一个连接");
      const removed = connections.splice(selected, 1)[0];
      selected = Math.min(selected, connections.length - 1);
      markDirty();
      renderAll();
      toast(`已删除“${removed.name}”`);
    }

    function parseAndValidateSource(text = jsonSource.value) {
      try {
        const parsed = JSON.parse(text);
        const candidateConnections = jsonScope === "current"
          ? connections.map((item, index) => index === selected ? parsed : item)
          : parsed;
        const validation = validateConnections(candidateConnections);
        if (!validation.ok) return { ok: false, kind: "structure", error: new Error(validation.message) };
        return { ok: true, candidateConnections };
      } catch (error) {
        return { ok: false, kind: "syntax", error };
      }
    }

    function renderJsonStatus(result, pending = false) {
      const status = $("#json-status");
      status.textContent = result.ok ? (pending ? "有效，待应用" : "有效") : result.kind === "syntax" ? "JSON 无效" : "结构无效";
      status.classList.toggle("json-valid", result.ok);
    }

    function reconcileSecretStates(previousStates, parsed) {
      const nextByName = new Map(parsed.map(item => [item.name, item]));
      const transfers = [];
      const clears = [];
      previousStates.forEach(({ item, state }) => {
        if (!state) return;
        const next = nextByName.get(item.name);
        if (state.mode === "draft" && (!next || next.passwordRef !== item.passwordRef)) {
          throw new Error(`连接“${item.name}”有待保存密码，请先保存或清空密码草稿`);
        }
        if (!next || (state.mode === "revealed" && next.passwordRef !== item.passwordRef)) {
          clears.push(item);
        } else {
          transfers.push({ item: next, state });
        }
      });
      return { transfers, clears };
    }

    function commitPendingJsonSource() {
      if (!jsonSource.classList.contains("active")) return true;
      return applySource();
    }

    // JSON 解析会替换对象：先按唯一名称继承基准，仅在列表长度不变时按位置识别重命名。
    function transferSavedIdentities(previousItems, nextItems) {
      const previousByName = new Map(previousItems.map(item => [item.name, item]));
      const nextNames = new Set(nextItems.map(item => item.name));
      const matched = new Set();
      nextItems.forEach(item => {
        const previous = previousByName.get(item.name);
        if (!previous) return;
        matched.add(previous);
        const saved = savedByItem.get(previous);
        if (saved) savedByItem.set(item, saved);
      });
      if (previousItems.length !== nextItems.length) return;
      nextItems.forEach((item, index) => {
        if (savedByItem.has(item) || previousByName.has(item.name)) return;
        const previous = previousItems[index];
        if (matched.has(previous) || nextNames.has(previous.name)) return;
        const saved = savedByItem.get(previous);
        if (saved) savedByItem.set(item, saved);
      });
    }

    function applySource() {
      const result = parseAndValidateSource();
      renderJsonStatus(result);
      if (!result.ok) {
        toast(`JSON 未应用：${result.error.message}`);
        return false;
      }
      try {
        const previousStates = connections.map(item => ({ item, state: secretUi.get(item) }));
        const plan = reconcileSecretStates(previousStates, result.candidateConnections);
        const changed = !connectionsSemanticallyEqual(result.candidateConnections, connections);
        plan.clears.forEach(clearSecretState);
        plan.transfers.forEach(({ item, state }) => secretUi.set(item, state));
        transferSavedIdentities(connections, result.candidateConnections);
        connections = result.candidateConnections;
        selected = Math.min(selected, connections.length - 1);
        referenceName = current()?.name || "";
        jsonSource.value = jsonText();
        if (changed) markDirty();
        renderAll();
        return true;
      } catch (error) {
        renderJsonStatus({ ok: false, kind: "structure" });
        toast(`JSON 未应用：${error.message}`);
        return false;
      }
    }

    function syncJsonScopeState() {
      const all = jsonScope === "all";
      $("#json-scope-all").classList.toggle("active", all);
      $("#json-scope-current").classList.toggle("active", !all);
      $("#json-scope-all").setAttribute("aria-pressed", String(all));
      $("#json-scope-current").setAttribute("aria-pressed", String(!all));
    }

    function setJsonScope(scope) {
      if (scope === jsonScope) return;
      if (!commitPendingJsonSource()) return;
      jsonScope = scope;
      syncJsonScopeState();
      renderJson();
      if (jsonSource.classList.contains("active")) jsonSource.value = jsonText();
    }

    function setJsonView(mode) {
      const source = mode === "source";
      if (!source && !commitPendingJsonSource()) return;
      $("#preview-mode").classList.toggle("active", !source);
      $("#source-mode").classList.toggle("active", source);
      jsonPreview.classList.toggle("hidden", source);
      jsonSource.classList.toggle("active", source);
      form.inert = source;
      if (source) { jsonSource.value = jsonText(); jsonSource.focus(); }
    }

    function syncJsonPanelState() {
      workspace.classList.toggle("json-panel-closed", !jsonPanelOpen);
      jsonPanel.classList.toggle("closed", !jsonPanelOpen);
      jsonPanel.classList.toggle("open", jsonPanelOpen);
      const toggle = $("#json-toggle");
      toggle.setAttribute("aria-expanded", String(jsonPanelOpen));
      toggle.setAttribute("aria-pressed", String(jsonPanelOpen));
      toggle.classList.toggle("active", jsonPanelOpen);
      toggle.setAttribute("aria-label", jsonPanelOpen ? "关闭 JSON" : "打开 JSON");
      toggle.title = jsonPanelOpen ? "关闭 JSON" : "打开 JSON";
    }

    function setJsonPanelOpen(open) {
      if (!open && jsonPanelOpen && !commitPendingJsonSource()) return;
      jsonPanelOpen = open;
      syncJsonPanelState();
    }

    function toast(message) {
      clearTimeout(toastTimer);
      $("#toast-text").textContent = message;
      $("#toast").classList.add("show");
      toastTimer = setTimeout(() => $("#toast").classList.remove("show"), 2300);
    }

    async function apiRequest(path, options = {}) {
      const headers = { ...(options.headers || {}), "X-Editor-Token": editorToken };
      const response = await fetch(path, { ...options, headers, cache: "no-store" });
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.error || `请求失败 (${response.status})`);
      return payload;
    }

    function reportEditorActivity() {
      if (location.protocol === "file:") return;
      const now = Date.now();
      if (now - lastActivityReport < ACTIVITY_REPORT_INTERVAL_MS) return;
      lastActivityReport = now;
      apiRequest("/api/activity", { method: "POST", body: "{}" }).catch(() => {});
    }

    async function loadConfiguration(expectedVersion = editVersion) {
      if (location.protocol === "file:") {
        renderAll();
        return true;
      }
      try {
        const payload = await apiRequest("/api/config");
        const nextConnections = payload.connections;
        const connectionValidation = validateConnections(nextConnections);
        if (!connectionValidation.ok) throw new Error(`编辑器连接配置格式错误：${connectionValidation.message}`);
        const nextBlacklist = payload.defaults?.commandBlacklist;
        if (!Array.isArray(nextBlacklist) || !nextBlacklist.every(value => typeof value === "string")) {
          throw new Error("编辑器默认黑名单格式错误");
        }
        if (typeof payload.hash !== "string" || !payload.hash) throw new Error("编辑器配置版本格式错误");
        if (typeof payload.path !== "string" || !payload.path) throw new Error("编辑器配置路径格式错误");
        const snapshot = {
          connections: nextConnections,
          commandBlacklist: nextBlacklist,
          hash: payload.hash,
          path: payload.path
        };

        if (editVersion !== expectedVersion) {
          toast("重新载入期间配置已被修改，磁盘内容未应用");
          return false;
        }

        connections = snapshot.connections;
        defaultCommandBlacklist = snapshot.commandBlacklist;
        configHash = snapshot.hash;
        selected = 0;
        referenceName = connections[0].name;
        captureSavedSnapshot(connections);
        setTestStatus();
        editVersion = 0;
        $("#config-path").textContent = snapshot.path;
        $("#add-default-blacklist").disabled = false;
        jsonSource.value = jsonText();
        renderAll();
        return true;
      } catch (error) {
        toast(error.message);
        return false;
      }
    }

    async function testConnection() {
      if (jsonSource.classList.contains("active") && !applySource()) return;
      const target = current();
      const jump = connections.find(item => item.name === target.jumpHost);
      const testItems = [target, jump].filter(Boolean);
      if (!validateConnections(testItems).ok) {
        validate();
        return setTestStatus("请先修正当前连接或跳板机配置", "failure");
      }
      if (location.protocol === "file:") return setTestStatus("文件预览模式无法测试连接", "failure");
      const version = editVersion;
      const passwordUpdates = testItems.flatMap(item => {
        const state = secretUi.get(item);
        return state?.mode === "draft" && state.draftValue
          ? [{ connection: item.name, password: state.draftValue }] : [];
      });
      const button = $("#test-connection");
      button.disabled = true;
      button.querySelector("span").textContent = "测试中...";
      setTestStatus("正在连接...");
      try {
        const result = await apiRequest("/api/connections/test", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ connections: testItems, connection: target.name, passwordUpdates })
        });
        if (current() !== target || editVersion !== version) return;
        setTestStatus(result.ok ? "连接成功" : `连接失败：${result.error}`, result.ok ? "success" : "failure");
      } catch (error) {
        if (current() === target && editVersion === version) setTestStatus(`连接失败：${error.message}`, "failure");
      } finally {
        button.disabled = false;
        button.querySelector("span").textContent = "测试连接";
      }
    }

    async function reloadConfiguration() {
      if (location.protocol === "file:") return toast("文件预览模式无法从磁盘重新载入");
      if (dirty && !window.confirm("当前修改尚未保存，仍要从磁盘重新载入吗？")) return;
      const button = $("#reload");
      button.disabled = true;
      const loaded = await loadConfiguration();
      button.disabled = false;
      if (loaded) toast("已从磁盘重新载入");
    }

    function discardChanges() {
      if (!dirty || $("#save").disabled) return;
      if (!window.confirm("撤销所有未保存的改动吗？")) return;
      connections.forEach(clearSecretState);
      connections = structuredClone(savedConnections);
      selected = Math.min(selected, connections.length - 1);
      referenceName = current().name;
      editVersion += 1;
      captureSavedSnapshot(connections);
      setTestStatus();
      jsonSource.value = jsonText();
      renderAll();
      renderJsonStatus({ ok: true });
      toast("已撤销未保存的改动");
    }

    async function closeEditor() {
      if (dirty && !window.confirm("当前修改尚未保存，仍要关闭编辑服务吗？")) return;
      if (location.protocol === "file:") return toast("文件预览模式没有编辑服务");
      const button = $("#close-editor");
      button.disabled = true;
      try {
        await apiRequest("/api/stop", { method: "POST", body: "{}" });
        toast("编辑服务已关闭");
        setTimeout(() => window.close(), 150);
      } catch (error) {
        button.disabled = false;
        toast(error.message);
      }
    }

    async function saveConfiguration() {
      if (jsonSource.classList.contains("active") && !applySource()) return;
      if (!validate()) return toast("请先修正配置错误");
      if (location.protocol === "file:") return toast("文件预览模式不会写入磁盘");

      const saveConnections = structuredClone(connections);
      const savedItems = connections.slice();
      const draftSnapshots = connections.flatMap(item => {
        const state = secretUi.get(item);
        return item.passwordRef && state?.mode === "draft" && state.draftValue
          ? [{ item, state, connection: item.name, password: state.draftValue }]
          : [];
      });
      const passwordUpdates = draftSnapshots.map(({ connection, password }) => ({ connection, password }));
      const button = $("#save");
      button.disabled = true;
      $("#discard").disabled = true;
      try {
        const payload = await apiRequest("/api/config", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ connections: saveConnections, expectedHash: configHash, passwordUpdates })
        });
        configHash = payload.hash;
        draftSnapshots.forEach(snapshot => {
          const state = secretUi.get(snapshot.item);
          if (state === snapshot.state && state.mode === "draft" && state.draftValue === snapshot.password) {
            clearSecretState(snapshot.item);
          }
        });
        captureSavedSnapshot(saveConnections, savedItems);
        transferSavedIdentities(savedItems, connections);
        updateSyncState();
        renderSecret();
        toast("配置已保存");
      } catch (error) {
        toast(error.message);
      } finally {
        button.disabled = false;
        updateSyncState();
      }
    }

    list.addEventListener("click", event => {
      const item = event.target.closest("[data-index]");
      if (item) selectConnection(Number(item.dataset.index));
    });
    $("#search").addEventListener("input", renderList);
    form.addEventListener("input", updateFromForm);
    form.addEventListener("click", event => {
      const auth = event.target.closest("[data-auth]");
      const reveal = event.target.closest("[data-reveal]");
      const replace = event.target.closest("[data-replace]");
      if (auth) setAuthMode(auth.dataset.auth);
      if (reveal) revealPassword();
      if (replace) replacePassword();
    });

    $$(".tab").forEach(tab => tab.addEventListener("click", () => {
      $$(".tab").forEach(item => { const active = item === tab; item.classList.toggle("active", active); item.setAttribute("aria-selected", String(active)); });
      $$(".tab-page").forEach(page => page.classList.toggle("active", page.dataset.page === tab.dataset.tab));
    }));

    $("#add").addEventListener("click", addConnection);
    $("#duplicate").addEventListener("click", duplicateConnection);
    $("#delete").addEventListener("click", deleteConnection);
    $("#save").addEventListener("click", saveConfiguration);
    $("#test-connection").addEventListener("click", testConnection);
    $("#discard").addEventListener("click", discardChanges);
    $("#reload").addEventListener("click", reloadConfiguration);
    $("#close-editor").addEventListener("click", closeEditor);
    $("#add-default-blacklist").addEventListener("click", addDefaultBlacklist);

    $("#json-toggle").addEventListener("click", () => setJsonPanelOpen(!jsonPanelOpen));
    $("#close-json").addEventListener("click", () => setJsonPanelOpen(false));
    jsonPanelMedia.addEventListener("change", event => setJsonPanelOpen(!event.matches));
    $("#preview-mode").addEventListener("click", () => setJsonView("preview"));
    $("#source-mode").addEventListener("click", () => setJsonView("source"));
    $("#json-scope-all").addEventListener("click", () => setJsonScope("all"));
    $("#json-scope-current").addEventListener("click", () => setJsonScope("current"));
    jsonSource.addEventListener("input", () => {
      markDirty();
      renderJsonStatus(parseAndValidateSource(), true);
    });
    $("#copy-json").addEventListener("click", async () => {
      try {
        const text = jsonSource.classList.contains("active") ? jsonSource.value : jsonText();
        await navigator.clipboard.writeText(text);
        toast("JSON 已复制");
      }
      catch { toast("浏览器未允许访问剪贴板"); }
    });

    ["pointerdown", "keydown", "input"].forEach(type => {
      document.addEventListener(type, reportEditorActivity, { capture: true, passive: true });
    });

    window.addEventListener("beforeunload", event => {
      if (!dirty) return;
      event.preventDefault();
      event.returnValue = "";
    });

    window.addEventListener("keydown", event => {
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "s") { event.preventDefault(); $("#save").click(); }
    });

    captureSavedSnapshot(connections);
    syncJsonScopeState();
    syncJsonPanelState();
    renderChromeIcons();
    loadConfiguration();
  </script>
</body>
</html>
